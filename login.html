<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Yanone+Kaffeesatz" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">

  <!-- Theme core CSS -->
  <link rel="stylesheet" href="assets/vendors/elementor-icons.css">
  <link rel="stylesheet" href="assets/vendors/elementor-frontend.css">
  <link rel="stylesheet" href="assets/vendors/magnific-popup.css">
  <link rel="stylesheet" href="assets/css/vendors.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/blocks.css">
  <link rel="stylesheet" href="assets/css/custom-styles.css">

  <!-- Page-specific styles for login -->
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <!-- Paste your existing <header>...</header> block here (same as index.html) -->

  <main id="auth-page">
  <section id="auth-hero">
    <img src="assets/images/hero/header.jpg" alt="Suite Rife On Deck" id="auth-logo" />
  </section>

  <section id="login-section" class="auth-card">
    <div class="wrapper">
      <h1>Sign in to your account</h1>
      <p class="auth-subtitle">Account Information</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required />
        </div>

        <div id="login-error" class="auth-error" style="display:none;"></div>

        <button type="submit" class="button lg-bttn">Sign In</button>
      </form>

      <p class="auth-alt">If you don't have an account</p>
      <a href="register.html" class="button small-bttn register">Register</a>

      <p class="auth-alt">Forgot your Email or Password?</p>
      <a href="#" id="reset-password-link" class="button small-bttn auth-danger">Reset Password</a>
    </div>
  </section>
</main>

  <!-- Paste your existing <footer>...</footer> block here (same as index.html) -->
   <footer id="main-footer" class="footer-page">
        <img src="assets/images/hero/footer.png">
    </footer>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>

  <!-- Core scripts (jQuery, theme JS, etc.) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-migrate/3.4.1/jquery-migrate.min.js"></script>
  <script src="assets/vendors/scripts.js"></script>

  <!-- Login logic -->
  <script src="assets/js/auth.js"></script>
</body>
</html>
